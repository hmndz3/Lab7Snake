<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Snake con React</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #222;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      background: #111;
      border: 2px solid #888;
    }

    .cell {
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      border: 1px solid #2a2a2a;
    }

    .cell.snake-body {
      background: #4caf50;
      border-color: #388e3c;
    }

    .cell.snake-head {
      background: #81c784;
      border-color: #388e3c;
    }

    .cell.food {
      background: #e53935;
      border-color: #b71c1c;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const BOARD_SIZE = 20;
    const TICK_MS = 150; 

    const DIRECTIONS = {
      UP:    { row: -1, col:  0 },
      DOWN:  { row:  1, col:  0 },
      LEFT:  { row:  0, col: -1 },
      RIGHT: { row:  0, col:  1 },
    };

    const KEY_TO_DIRECTION = {
      ArrowUp:    DIRECTIONS.UP,
      ArrowDown:  DIRECTIONS.DOWN,
      ArrowLeft:  DIRECTIONS.LEFT,
      ArrowRight: DIRECTIONS.RIGHT,
      w: DIRECTIONS.UP,
      s: DIRECTIONS.DOWN,
      a: DIRECTIONS.LEFT,
      d: DIRECTIONS.RIGHT,
    };


    function isOpposite(dirA, dirB) {
      return dirA.row + dirB.row === 0 && dirA.col + dirB.col === 0;
    }


    const INITIAL_SNAKE = [
      { row: 10, col: 10 },
      { row: 10, col: 9 },
      { row: 10, col: 8 },
    ];

    const INITIAL_FOOD = { row: 5, col: 15 };


    function Snake({ segments }) {
      return null; 
    }


    function Food({ position }) {
      return null;
    }


    function Board({ size, snake, food }) {
      const isSnakeHead = (row, col) =>
        snake[0].row === row && snake[0].col === col;

      const isSnakeBody = (row, col) =>
        snake.slice(1).some((seg) => seg.row === row && seg.col === col);

      const isFood = (row, col) =>
        food.row === row && food.col === col;

      const cells = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          let className = "cell";
          if (isSnakeHead(row, col)) className += " snake-head";
          else if (isSnakeBody(row, col)) className += " snake-body";
          else if (isFood(row, col)) className += " food";

          cells.push(
            <div key={`${row}-${col}`} className={className}></div>
          );
        }
      }
      return <div className="board">{cells}</div>;
    }

    function Game() {
      const [snake, setSnake] = useState(INITIAL_SNAKE);
      const [food, setFood] = useState(INITIAL_FOOD);
      const [direction, setDirection] = useState(DIRECTIONS.RIGHT);

      useEffect(() => {
        function handleKeyDown(event) {
          const newDirection = KEY_TO_DIRECTION[event.key];
          if (!newDirection) return; 

          if (isOpposite(newDirection, direction)) return;

          setDirection(newDirection);
        }

        window.addEventListener("keydown", handleKeyDown);

        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [direction]);

      useEffect(() => {
        const intervalId = setInterval(() => {
          setSnake((prevSnake) => {
            const head = prevSnake[0];
            const newHead = {
              row: head.row + direction.row,
              col: head.col + direction.col,
            };
            return [newHead, ...prevSnake.slice(0, -1)];
          });
        }, TICK_MS);

        return () => clearInterval(intervalId);
      }, [direction]);

      return (
        <div>
          <Board size={BOARD_SIZE} snake={snake} food={food} />
          {/* Snake y Food se mantienen como componentes declarados aunque
              el render visual ocurra dentro de Board. Esto deja el código
              listo para crecer y cumple con la separación pedida. */}
          <Snake segments={snake} />
          <Food position={food} />
        </div>
      );
    }

    // Componente App: contenedor principal
    function App() {
      return (
        <div>
          <h1>Snake</h1>
          <Game />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
