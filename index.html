<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Snake con React</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #222;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      background: #111;
      border: 2px solid #888;
    }

    .cell {
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      border: 1px solid #2a2a2a;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React, ReactDOM y Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const BOARD_SIZE = 20;

    // Componente Board: solo dibuja la cuadrícula (recibe data por props)
    function Board({ size }) {
      const cells = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          cells.push(
            <div key={`${row}-${col}`} className="cell"></div>
          );
        }
      }
      return <div className="board">{cells}</div>;
    }

    // Componente Game: contenedor del estado del juego
    function Game() {
      return (
        <div>
          <Board size={BOARD_SIZE} />
        </div>
      );
    }

    // Componente App: contenedor principal
    function App() {
      return (
        <div>
          <h1>Snake</h1>
          <Game />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
