<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Snake con React</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #222;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(20, 20px);
      grid-template-rows: repeat(20, 20px);
      background: #111;
      border: 2px solid #888;
    }

    .cell {
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      border: 1px solid #2a2a2a;
    }

    .cell.snake-body {
      background: #4caf50;
      border-color: #388e3c;
    }

    .cell.snake-head {
      background: #81c784;
      border-color: #388e3c;
    }

    .cell.food {
      background: #e53935;
      border-color: #b71c1c;
    }

    .board-wrapper {
      position: relative;
    }

    .game-over {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      gap: 10px;
    }

    .game-over .title {
      font-size: 32px;
      color: #ff5252;
    }

    .game-over .hint {
      font-size: 14px;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const BOARD_SIZE = 20;
    const TICK_MS = 150;

    const DIRECTIONS = {
      UP:    { row: -1, col:  0 },
      DOWN:  { row:  1, col:  0 },
      LEFT:  { row:  0, col: -1 },
      RIGHT: { row:  0, col:  1 },
    };

    const KEY_TO_DIRECTION = {
      ArrowUp:    DIRECTIONS.UP,
      ArrowDown:  DIRECTIONS.DOWN,
      ArrowLeft:  DIRECTIONS.LEFT,
      ArrowRight: DIRECTIONS.RIGHT,
      w: DIRECTIONS.UP,
      s: DIRECTIONS.DOWN,
      a: DIRECTIONS.LEFT,
      d: DIRECTIONS.RIGHT,
    };

    const INITIAL_SNAKE = [
      { row: 10, col: 10 },
      { row: 10, col: 9 },
      { row: 10, col: 8 },
    ];

    const INITIAL_FOOD = { row: 5, col: 15 };

    function isOpposite(dirA, dirB) {
      return dirA.row + dirB.row === 0 && dirA.col + dirB.col === 0;
    }

    function getRandomFoodPosition(snake) {
      while (true) {
        const newFood = {
          row: Math.floor(Math.random() * BOARD_SIZE),
          col: Math.floor(Math.random() * BOARD_SIZE),
        };
        const onSnake = snake.some(
          (seg) => seg.row === newFood.row && seg.col === newFood.col
        );
        if (!onSnake) return newFood;
      }
    }

    function hitsWall(head) {
      return (
        head.row < 0 ||
        head.row >= BOARD_SIZE ||
        head.col < 0 ||
        head.col >= BOARD_SIZE
      );
    }

    function hitsSelf(head, body) {
      return body.some((seg) => seg.row === head.row && seg.col === head.col);
    }

    function Snake({ segments }) {
      return null;
    }

    function Food({ position }) {
      return null;
    }

    function Score({ value }) {
      return <div className="score">Puntaje: {value}</div>;
    }

    function Board({ size, snake, food }) {
      const isSnakeHead = (row, col) =>
        snake[0].row === row && snake[0].col === col;

      const isSnakeBody = (row, col) =>
        snake.slice(1).some((seg) => seg.row === row && seg.col === col);

      const isFood = (row, col) =>
        food.row === row && food.col === col;

      const cells = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          let className = "cell";
          if (isSnakeHead(row, col)) className += " snake-head";
          else if (isSnakeBody(row, col)) className += " snake-body";
          else if (isFood(row, col)) className += " food";

          cells.push(
            <div key={`${row}-${col}`} className={className}></div>
          );
        }
      }
      return <div className="board">{cells}</div>;
    }

    function Game() {
      const [snake, setSnake] = useState(INITIAL_SNAKE);
      const [food, setFood] = useState(INITIAL_FOOD);
      const [direction, setDirection] = useState(DIRECTIONS.RIGHT);
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);

      function resetGame() {
        setSnake(INITIAL_SNAKE);
        setFood(INITIAL_FOOD);
        setDirection(DIRECTIONS.RIGHT);
        setScore(0);
        setGameOver(false);
      }

      useEffect(() => {
        function handleKeyDown(event) {
          if (gameOver) {
            if (event.key === " " || event.key === "Enter") {
              resetGame();
            }
            return;
          }

          const newDirection = KEY_TO_DIRECTION[event.key];
          if (!newDirection) return;
          if (isOpposite(newDirection, direction)) return;
          setDirection(newDirection);
        }

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [direction, gameOver]);

      useEffect(() => {
        if (gameOver) return;

        const intervalId = setInterval(() => {
          setSnake((prevSnake) => {
            const head = prevSnake[0];
            const newHead = {
              row: head.row + direction.row,
              col: head.col + direction.col,
            };

            if (hitsWall(newHead)) {
              setGameOver(true);
              return prevSnake;
            }

            const ateFood =
              newHead.row === food.row && newHead.col === food.col;

            const bodyToCheck = ateFood
              ? prevSnake
              : prevSnake.slice(0, -1);

            if (hitsSelf(newHead, bodyToCheck)) {
              setGameOver(true);
              return prevSnake;
            }

            let newSnake;
            if (ateFood) {
              newSnake = [newHead, ...prevSnake];
              setScore((s) => s + 10);
              setFood(getRandomFoodPosition(newSnake));
            } else {
              newSnake = [newHead, ...prevSnake.slice(0, -1)];
            }

            return newSnake;
          });
        }, TICK_MS);

        return () => clearInterval(intervalId);
      }, [direction, food, gameOver]);

      return (
        <div>
          <Score value={score} />
          <div className="board-wrapper">
            <Board size={BOARD_SIZE} snake={snake} food={food} />
            {gameOver && (
              <div className="game-over">
                <div className="title">GAME OVER</div>
                <div>Puntaje final: {score}</div>
                <div className="hint">Presiona Espacio o Enter para reiniciar</div>
              </div>
            )}
          </div>
          <Snake segments={snake} />
          <Food position={food} />
        </div>
      );
    }

    function App() {
      return (
        <div>
          <h1>Snake</h1>
          <Game />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
